<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼 영역 */
    #userArea { margin: 12px 0; color: #333; font-size: 15px; display: flex; align-items: center; gap: 10px; }
    #userArea button { padding: 6px 12px; font-size: 14px; cursor: pointer; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 220px; font-size: 15px; position: relative; word-break: break-word; }
    .memo button.del-btn { float: right; cursor: pointer; }

    /* AI 코멘트 및 버튼 스타일 */
    .ai-box { margin-top: 10px; padding: 8px; background: #f0f7ff; border-left: 3px solid #3b82f6; border-radius: 4px; font-size: 13px; color: #1e3a8a; line-height: 1.4; }
    .ai-btn { margin-top: 8px; font-size: 12px; padding: 4px 8px; border: 1px solid #c7d2fe; background: #eef2ff; color: #4338ca; border-radius: 4px; cursor: pointer; }
    .ai-btn:hover { background: #e0e7ff; }
    .ai-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .ai-batch-btn { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; font-weight: bold; }
    .ai-batch-btn:hover { background: #dbeafe; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- 로그인 영역 (Google 로그인 버튼 및 내 이름이 들어옵니다) -->
  <div id="userArea"></div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
